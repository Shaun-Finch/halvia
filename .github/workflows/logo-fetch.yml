name: Look up logos on Wikimedia Commons
on:
  push:
    branches: [bot-lab]
    paths: [tools/fetch_logos.py, .github/workflows/logo-fetch.yml]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/fetch_logos.py
      - name: Publish
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: MSG="Logo candidates from Wikimedia Commons" tools/publish.sh logos

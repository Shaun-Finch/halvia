name: Fetch image candidates
on:
  push:
    branches: [image-fetch]
    paths: [tools/fetch_images.py, .github/workflows/fetch-images.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch openly licensed candidates from Wikimedia Commons
        run: python tools/fetch_images.py
      - name: Commit candidates to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates
          git commit -m "Image candidates from Wikimedia Commons" || echo "nothing new"
          git push

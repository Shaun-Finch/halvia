name: Weekly news
# Gathers the latest science and technology stories into data/news.json every Monday morning.
# Also runs when the collector changes, and can be run by hand from the Actions tab.
on:
  schedule:
    - cron: '23 6 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/news.py', '.github/workflows/news.yml']
permissions:
  contents: write
concurrency:
  group: weekly-news
  cancel-in-progress: false
jobs:
  news:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python tools/news.py
      - name: Commit the new stories
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898099+github-actions[bot]@users.noreply.github.com"
          git add data/news.json
          git diff --cached --quiet && exit 0
          git commit -m "News: weekly update"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && break; sleep 5; done

name: Fetch open-access research for Halvia bot
on:
  push:
    branches: [bot-lab]
    paths: [tools/fetch_research.py, .github/workflows/research.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: research, cancel-in-progress: false }
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Fetch CC BY / CC0 reviews and guidelines from Europe PMC
        run: python tools/fetch_research.py
      - name: Commit to this branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research
          git commit -m "Open-access research from Europe PMC" || echo "nothing new"
          git pull --rebase -q origin bot-lab || true
          git push
